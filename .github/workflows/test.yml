name: Verify AgentFlow
on: [push, pull_request]
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run ruff check src tests scripts migrations evals
      - run: uv run ruff format --check src tests scripts migrations evals
      - name: Architecture boundary guard
        run: uv run pytest tests/unit/test_architecture_boundaries.py -q
      - run: uv run pytest -q
      - name: PostgreSQL integration with isolated temporary instance
        run: uv run python scripts/verify_postgres.py --bin "$(pg_config --bindir)" ${{ matrix.python == '3.13' && '--release-gates' || '' }}
      - name: Python 3.12 PostgreSQL witness hardening
        if: matrix.python == '3.12'
        run: uv run python scripts/verify_postgres.py --bin "$(pg_config --bindir)" --witness-only
      - name: Offline business evaluation
        if: matrix.python == '3.13'
        run: uv run python evals/run.py
      - name: Bounded RC process and logical restore drills
        if: matrix.python == '3.13'
        run: |
          uv run python scripts/verify_durable_soak.py --bin "$(pg_config --bindir)" --seconds 30 --workload 6 --seed 7
          uv run python scripts/verify_runtime_backup.py --bin "$(pg_config --bindir)"
      - name: Build release package
        if: matrix.python == '3.13'
        run: |
          uv build
          uv run python scripts/verify_wheel.py dist/agentflow-1.0.0-py3-none-any.whl

  web:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  docker-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: '3.13'
      - run: uv sync --frozen
      - run: docker build -f deploy/docker/api.Dockerfile -t agentflow-api:1.0 .
      - run: docker build -f deploy/docker/sandbox.Dockerfile -t agentflow-sandbox:1.0 .
      - run: uv run pytest tests/integration/test_docker_sandbox.py -q
        env:
          AGENTFLOW_TEST_DOCKER: '1'

  compose-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGENTFLOW_POSTGRES_PASSWORD: ci-postgres-password
      AGENTFLOW_DATABASE_URL: postgresql+psycopg://agentflow:ci-postgres-password@postgres:5432/agentflow
      AGENTFLOW_API_TOKEN: ci-agentflow-operator-token-123456
      AGENTFLOW_PROVIDER: mock
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Start production-baseline services
        run: docker compose up --build -d postgres api worker web
      - name: Verify reference application evidence-to-approval flow through the web proxy
        run: python3 scripts/verify_compose.py
      - name: Verify action approval and reconciliation through the real API and Worker
        run: |
          docker compose stop worker
          docker compose exec -T api python - < scripts/verify_action_review_compose.py
      - name: Show service diagnostics
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200
      - name: Tear down isolated stack
        if: always()
        run: docker compose down -v --remove-orphans
