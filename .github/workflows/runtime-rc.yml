name: Manual durable runtime RC acceptance
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Bounded single-host soak duration
        type: choice
        default: '180'
        options: ['180', '600', '1800']
      live_deepseek:
        description: Authorize ONE paid fixed-prompt request (max 4096 output tokens); dedicated account spending cap required
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: '3.13'
      - run: uv sync --frozen
      - run: uv run python scripts/verify_durable_soak.py --bin "$(pg_config --bindir)" --seconds "${{ inputs.seconds }}" --workload 6 --seed 7
      - run: uv run python scripts/verify_runtime_backup.py --bin "$(pg_config --bindir)"
  live-provider:
    if: inputs.live_deepseek
    environment: live-provider-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: '3.13'
      - run: uv sync --frozen
      - run: uv run python scripts/verify_live_provider.py --allow-paid-request --report-version 2
        env:
          AGENTFLOW_LIVE_DEEPSEEK_AUTHORIZATION: one-paid-request
          AGENTFLOW_DEEPSEEK_API_KEY: ${{ secrets.AGENTFLOW_DEEPSEEK_API_KEY }}
