[project]
name = "agentflow"
version = "0.1.0"
requires-python = ">= 3.12"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "mcp>=1.12,<2",
    "prometheus-client>=0.21,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.30,<1",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6,<7",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.16.9",
]
