[project]
name = "agentflow"
version = "1.0.0"
requires-python = ">= 3.12"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jsonschema>=4.20,<5",
    "mcp>=1.12,<2",
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "prometheus-client>=0.21,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.30,<1",
    "websockets>=14,<17",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[project.scripts]
agentflow = "agentflow.interfaces.cli.main:main"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "hypothesis>=6,<7",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.16.9",
]
